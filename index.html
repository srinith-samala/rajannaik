    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Mukta:wght@400;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .playfair {
        font-family: 'Playfair Display', serif;
      }
      .mukta {
        font-family: 'Mukta', sans-serif;
      }
      .font-display {
        font-family: 'Playfair Display', serif;
      }

      .bg-bjp-orange {
        background-color: #FF9933;
      }

      .text-gradient-navy {
        background: linear-gradient(to bottom, #002147, #003366);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .shadow-elevated {
        box-shadow: 
          0 20px 50px -12px rgba(0, 33, 71, 0.15),
          0 0 1px rgba(0, 33, 71, 0.1);
      }

      .shadow-glow {
        box-shadow: 0 10px 30px -5px rgba(255, 153, 51, 0.4);
      }

      @keyframes pulse-soft {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.01); }
      }
      .animate-pulse-soft {
        animation: pulse-soft 4s ease-in-out infinite;
      }

      .text-navy {
        color: #002147;
      }
    </style>
